name: Feature request
description: Propose a focused improvement backed by a real use case
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        APA prioritizes evidence-based diagnostics, explicit user consent and bounded system access. Requests for arbitrary shell execution, hidden collection or automatic high-risk changes will not be accepted.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the real situation this feature should improve.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain what the user should be able to do and what result they should see.
    validations:
      required: true

  - type: dropdown
    id: capability
    attributes:
      label: Expected capability level
      options:
        - Ordinary Android APIs only
        - Usage Access
        - Shizuku
        - Root
        - Model provider / cloud request
        - Not sure
    validations:
      required: true

  - type: textarea
    id: privacy
    attributes:
      label: Data, permission and risk considerations
      description: What data or permission would be needed? What could go wrong, and how should the user remain in control?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: duplicate
    attributes:
      label: Duplicate check
      options:
        - label: I searched the roadmap and existing issues before opening this request.
          required: true
