name: Android CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: JVM tests, lint and preview APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install compile SDK and build tools
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-36.1' 'build-tools;36.0.0' 'platform-tools'
      - name: Run JVM tests, both lint variants and APK builds
        run: |
          bash ./gradlew --no-daemon --stacktrace --continue \
            :app:testDebugUnitTest :app:lintDebug :app:lintRelease \
            :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: checks-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload preview and instrumentation APKs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: preview-and-test-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

  instrumentation:
    name: Instrumentation on Android 16
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_SERIAL: emulator-5554
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDK and Android 16 emulator image
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-36.1' 'build-tools;36.0.0' 'platform-tools' \
            'emulator' 'system-images;android-36;google_apis;x86_64'
      - name: Build preview and test APKs
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM and boot emulator
        timeout-minutes: 8
        run: |
          mkdir -p ci-emulator
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name apa-ci --package 'system-images;android-36;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd apa-ci -port 5554 \
            -accel on -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu software > ci-emulator/emulator.log 2>&1 &
          timeout 300 bash -c '
            until [ "$("$ANDROID_HOME/platform-tools/adb" -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do
              sleep 2
            done
          '
          "$ANDROID_HOME/platform-tools/adb" shell input keyevent 82
          "$ANDROID_HOME/platform-tools/adb" shell settings put secure show_ime_with_hard_keyboard 1
          "$ANDROID_HOME/platform-tools/adb" shell settings put global window_animation_scale 0
          "$ANDROID_HOME/platform-tools/adb" shell settings put global transition_animation_scale 0
          "$ANDROID_HOME/platform-tools/adb" shell settings put global animator_duration_scale 0
      - name: Run connected instrumentation tests
        timeout-minutes: 20
        run: bash ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Collect emulator diagnostics and stop emulator
        if: always()
        run: |
          mkdir -p ci-emulator
          timeout 15 "$ANDROID_HOME/platform-tools/adb" devices -l > ci-emulator/devices.txt 2>&1 || true
          timeout 15 "$ANDROID_HOME/platform-tools/adb" logcat -d > ci-emulator/logcat.txt 2>&1 || true
          timeout 15 "$ANDROID_HOME/platform-tools/adb" emu kill || true
      - name: Upload instrumentation reports and emulator diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ci-emulator/
          if-no-files-found: warn
          retention-days: 14
